name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # bob.jar's classes are major version 69, i.e. Java 25. On 21 it
          # dies with UnsupportedClassVersionError before running a single
          # task — this workflow had been failing on every push because of
          # it. Verify with: unzip -p .defold/bob.jar com/dynamo/bob/Bob.class
          java-version: "25"

      - name: Cache Defold headless tools
        uses: actions/cache@v4
        with:
          path: .defold
          # Keep in sync with DEFOLD_VERSION in scripts/run_tests.sh — bumping
          # that constant must invalidate this cache instead of silently
          # reusing a stale engine/bob.jar.
          key: defold-tools-${{ runner.os }}-1.13.0

      - name: Run unit + integration tests
        run: ./scripts/run_tests.sh x86_64-linux

      # The suite boots test/test.collection and never touches
      # main.collection, so for 28 phases nothing verified that the game
      # itself starts. It did not: the level proxies were malformed and the
      # engine asserted during init the first time anyone ran it. This step
      # is the cheap guard against that whole class — it only proves the
      # bootstrap collection loads, which is exactly what was missing.
      # Geometry only — no engine needed, so it runs before the slow steps
      # and fails fast. It found a genuinely unreachable platform in level 8
      # the first time it ran.
      - name: Check every level can be completed
        run: make check-levels

      - name: Boot smoke test
        run: make smoke
