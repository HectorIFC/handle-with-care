name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Defold headless tools
        uses: actions/cache@v4
        with:
          path: .defold
          # Keep in sync with DEFOLD_VERSION in scripts/run_tests.sh — bumping
          # that constant must invalidate this cache instead of silently
          # reusing a stale engine/bob.jar.
          key: defold-tools-${{ runner.os }}-1.13.0

      - name: Run unit + integration tests
        run: ./scripts/run_tests.sh x86_64-linux
